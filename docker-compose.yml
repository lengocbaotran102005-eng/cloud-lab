services:
  backend:
    build: ./server
    container_name: mern-backend
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
    env_file:
      - ./server/.env
    restart: always

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always